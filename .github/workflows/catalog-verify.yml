# Full real-install regression over the shipped catalog: every entry really
# installs inside a disposable clean Ubuntu 24.04 guest (tests/integration/).
# Manual (workflow_dispatch) + weekly schedule (upstream drift detection:
# vendor URLs, repo keys and store names move under us). Deliberately NOT a
# PR gate — the full run is tens of minutes per tier (see ci.yml for the gate).
#
# Action pins (verified against the GitHub API 2026-06-11):
#   actions/checkout@v6        (latest release v6.0.3)
#   actions/setup-python@v6    (latest release v6.2.0)
#   actions/upload-artifact@v7 (latest release v7.0.1)
#   canonical/setup-lxd        (third-party AND alpha, so pinned to the immutable
#                               commit SHA instead of the movable v1 tag;
#                               8c6a87bf... = v1, latest release, 2025-12-11)
name: catalog-verify

on:
  workflow_dispatch:
  schedule:
    # weekly drift check (Mondays 03:17 UTC; scheduled runs fire from the
    # default branch only — the workflow must exist on main for this to run)
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.tier }}
    runs-on: ubuntu-24.04
    # local wall-clock x2 for the slower CI runners (prd: apt 856s, deb 1734s,
    # ppa 456s, script 2661s); snap has no local baseline (LXD-only tier, the
    # IDE snaps are 1.3-1.7 GB) so it gets a generous 90.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: apt
            module: tests.integration.test_container_catalog
            timeout: 35
          - tier: deb
            module: tests.integration.test_container_deb_catalog
            timeout: 70
          - tier: ppa
            module: tests.integration.test_container_ppa_catalog
            timeout: 20
          - tier: script
            module: tests.integration.test_container_script_catalog
            timeout: 100
          - tier: snap
            module: tests.integration.test_system_snap
            timeout: 90
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The host side imports ubuntu_setup.core.catalog (pyyaml/jsonschema);
      # the harness builds the guest wheel via its pip fallback — the runner
      # image ships no uv, and installing one would only add a step.
      - name: Install project
        run: python -m pip install -e .

      # Installs the LXD snap and grants the runner user socket access via
      # daemon.group=adm — LxdDriver's unprivileged `lxc info` probe then
      # succeeds (/snap/bin is on the runner PATH). The action also opens
      # lxdbr0 through Docker's DOCKER-USER iptables chain (the known
      # container-egress trap on GHA runners). Channel pinned to the LTS
      # track so LXD churn never masquerades as catalog drift.
      - name: Set up LXD (snap tier only)
        if: matrix.tier == 'snap'
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
        with:
          channel: 5.21/stable

      # UBUNTU_SETUP_VERIFY_BASE_IMAGE is deliberately NOT set: that mirror
      # knob exists for one dev machine behind a docker.io-mangling proxy;
      # CI verifies against the official ubuntu:24.04.
      - name: Run the ${{ matrix.tier }} tier
        env:
          UBUNTU_SETUP_INTEGRATION: "1"
        run: python -m unittest ${{ matrix.module }} -v

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-artifacts-${{ matrix.tier }}
          path: tests/integration/_artifacts/
          if-no-files-found: ignore
          retention-days: 14
