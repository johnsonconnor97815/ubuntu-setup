# Declarative catalog — network tools & servers. Data, not code; validated
# against schema.json at load time.
# Sourcing: upstream install doc URL + intersection-research hits per entry
# (.trellis/tasks/06-10-intersection-research/research/final-list.json).

# https://aria2.github.io/ — hits: homebrew+pkgstats (core), popcon+awesome (aux).
# Upstream ships no Linux binaries; noble's 1.37 IS the latest upstream release.
- id: aria2
  description: "Multi-protocol download utility (aria2c)"
  type: apt
  package: aria2
  tags: [network, download]
  source: official

# https://httpie.io/docs/cli/debian-and-ubuntu — hits: homebrew+pkgstats (core),
# awesome (aux). noble's 3.2.2 is one patch behind upstream 3.2.4; the official
# packages.httpie.io deb repo is the fresh path.
- id: httpie
  description: "Human-friendly HTTP client (http/https commands)"
  type: apt
  package: httpie
  tags: [network, http, cli]
  source: official

# https://software.es.net/iperf/obtaining.html — hits: homebrew+pkgstats (core),
# popcon (aux). ESnet ships no binaries; the obtaining page says apt for Ubuntu.
# Install has a debconf "start as daemon?" question — noninteractive default is fine.
- id: iperf3
  description: "Network throughput measurement tool"
  type: apt
  package: iperf3
  tags: [network, benchmark]
  source: official

# https://nginx.org/en/linux_packages.html#Ubuntu — hits: homebrew+pkgstats (core),
# popcon (aux). noble's 1.24 is Ubuntu-maintained; nginx.org's own repo carries
# newer stable/mainline (future deb-provider candidate; note the layout differs).
# Service running needs systemd — install/idempotency verify in containers.
- id: nginx
  description: "High-performance HTTP server / reverse proxy"
  type: apt
  package: nginx
  tags: [network, server, web]
  source: official

# https://nmap.org/book/inst-linux.html — hits: homebrew+pkgstats (core), popcon (aux).
# Official install book: `apt-get install nmap` for Debian/Ubuntu.
- id: nmap
  description: "Network exploration and security scanner"
  type: apt
  package: nmap
  tags: [network, security]
  source: official

# https://www.gnu.org/software/wget/ — hits: homebrew+curation+pkgstats (core),
# popcon (aux); also cited as prerequisite by 9 researched entries. GNU ships
# source only; preinstalled on standard Ubuntu (priority: standard).
- id: wget
  description: "Network downloader (usually preinstalled on standard Ubuntu)"
  type: apt
  package: wget
  tags: [network, download, bedrock]
  source: official
