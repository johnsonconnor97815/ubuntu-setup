# Declarative catalog — version control. Data, not code; validated against
# schema.json at load time.
# Sourcing: upstream install doc URL + intersection-research hits per entry
# (.trellis/tasks/06-10-intersection-research/research/final-list.json).

# https://git-scm.com/install/linux — hits: so-survey+homebrew+curation+pkgstats
# (core), popcon (aux). Official install page: `apt-get install git`; the
# official ppa:git-core/ppa carries the latest stable (future ppa candidate).
- id: git
  description: "Distributed version control"
  type: apt
  package: git
  tags: [vcs, git]
  source: official

# https://github.com/git-lfs/git-lfs/blob/main/INSTALLING.md — hits:
# homebrew+pkgstats (core), popcon (aux). noble ships 3.4 and upstream does not
# oppose distro packages; `git lfs install` (per-user hook activation) is a
# config step, not part of installation.
- id: git-lfs
  description: "Git extension for large files (run `git lfs install` per user once)"
  type: apt
  package: git-lfs
  tags: [vcs, git]
  source: official

# https://gitlab.com/gitlab-org/cli#installation — hits:
# so-survey+homebrew+pkgstats (core). noble universe's 1.36 is well behind
# upstream (fast release cadence); the official release .deb is the fresh path
# if version gaps start to bite.
- id: glab
  description: "GitLab CLI"
  type: apt
  package: glab
  tags: [vcs, git, gitlab]
  source: official

# https://github.com/cli/cli/blob/trunk/docs/install_linux.md — repo half of
# the gh chain (hits on the gh entry below). The official doc marks this repo
# "Recommended (Official)". Verified 2026-06-11: the signing key
# githubcli-archive-keyring.gpg is ALREADY a binary keyring (no dearmor —
# the provider sniffs); suite stable, component main, architectures default
# to the host's (official line uses $(dpkg --print-architecture)).
- id: gh-repo
  description: "GitHub CLI official APT repository (cli.github.com/packages)"
  type: deb
  name: github-cli
  key_url: "https://cli.github.com/packages/githubcli-archive-keyring.gpg"
  repo_url: "https://cli.github.com/packages"
  suite: stable
  components: [main]
  depends_on: [curl]
  tags: [vcs, repo]
  source: official

# https://github.com/cli/cli/blob/trunk/docs/install_linux.md — hits:
# so-survey+homebrew+pkgstats (core), popcon (aux). noble universe's gh 2.45
# is well behind upstream and not GitHub-maintained; the official repo above
# is the doc's only "Recommended (Official)" install path.
- id: gh
  description: "GitHub CLI (official cli.github.com apt repo)"
  type: apt
  package: gh
  depends_on: [gh-repo]
  tags: [vcs, git, github]
  source: official

# https://github.com/jesseduffield/lazygit#installation — hits:
# homebrew+pkgstats (core), awesome (aux). Not in the noble archive (apt only
# from Ubuntu 25.10 / Debian 13 on); the README's block for "Ubuntu 25.04 and
# earlier" is quoted verbatim (2026-06-11) with two adaptations: the work
# happens in a mktemp -d (never the invoker's cwd) and the README's inline
# `sudo install` drops its sudo — the entry declares `sudo: true` so the
# engine escalates the whole command per-command instead. The README line
# resolves the arch itself (uname -m, aarch64 -> arm64).
- id: lazygit
  description: "lazygit — terminal UI for git (GitHub release binary in /usr/local/bin)"
  type: script
  sudo: true
  check: test -x /usr/local/bin/lazygit
  install: >-
    cd "$(mktemp -d)" &&
    LAZYGIT_VERSION=$(curl -s "https://api.github.com/repos/jesseduffield/lazygit/releases/latest"
    | grep -Po '"tag_name": *"v\K[^"]*') &&
    LAZYGIT_ARCH=$(uname -m | sed -e 's/aarch64/arm64/') &&
    curl -Lo lazygit.tar.gz "https://github.com/jesseduffield/lazygit/releases/download/v${LAZYGIT_VERSION}/lazygit_${LAZYGIT_VERSION}_Linux_${LAZYGIT_ARCH}.tar.gz" &&
    tar xf lazygit.tar.gz lazygit &&
    install lazygit -D -t /usr/local/bin/
  depends_on: [curl]
  tags: [vcs, git, tui]
  source: official
