# https://www.spotify.com/download/linux/ — repo half of the spotify chain
# (hits on the spotify entry below). Official deb repo verified 2026-06-11:
# repository.spotify.com stable non-free. CAVEAT: the signing key id ROTATES —
# key_url embeds the current pubkey filename (pubkey_5384CE82BA52C83A.asc,
# matching the download page today); when Spotify rotates, update key_url from
# that page. We place it as a scoped signed-by keyring (modern idiom), not
# their legacy trusted.gpg.d suggestion.
- id: spotify-repo
  description: "Spotify official APT repository (repository.spotify.com)"
  type: deb
  name: spotify
  key_url: "https://download.spotify.com/debian/pubkey_5384CE82BA52C83A.asc"
  repo_url: "https://repository.spotify.com"
  suite: stable
  components: [non-free]
  depends_on: [curl, gnupg]
  tags: [gui, media, repo]
  source: official

# https://www.spotify.com/download/linux/ — hits: flathub+pkgstats (core),
# popcon (aux). deb repo chosen over the also-official snap (project priority
# deb > snap; snap would need a VM to verify). Linux is not an officially
# supported Spotify platform (their stated caveat).
- id: spotify
  description: "Spotify desktop client (official apt repo; package spotify-client)"
  type: apt
  package: spotify-client
  depends_on: [spotify-repo]
  requires: [desktop]
  tags: [gui, media, audio]
  source: official

