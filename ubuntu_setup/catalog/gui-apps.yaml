# https://store.steampowered.com/about/ — hits: flathub+curation+pkgstats
# (core), popcon (aux). Official steam.deb (CDN permalink, always current;
# verified 2026-06-11) installs the launcher; it self-configures
# repo.steampowered.com for upgrades. i386 NOTE (entries-deb decision): the
# .deb's hard Depends carry NO i386 packages — steam-libs-i386 is only a
# Recommends, so installation converges without i386 multiarch under our
# --no-install-recommends idiom; enabling `dpkg --add-architecture i386` (which
# the Steam client needs at RUNTIME to actually run games) stays a manual
# user step outside the deb provider's responsibility.
- id: steam
  description: "Steam launcher (official steam.deb; running games needs i386 multiarch enabled manually)"
  type: deb
  deb_url: "https://cdn.fastly.steamstatic.com/client/installer/steam.deb"
  package: steam-launcher
  depends_on: [curl]
  requires: [desktop]
  tags: [gui, gaming]
  source: official
