# --------------------------------------------------------------------------- #
# Browsers (third-party official repos / vendor .debs — entries-deb batch)
# --------------------------------------------------------------------------- #

# https://support.mozilla.org/en-US/kb/install-firefox-linux — repo half of the
# firefox chain (hits on the firefox entry below). Official Mozilla APT repo
# verified 2026-06-11: key https://packages.mozilla.org/apt/repo-signing-key.gpg
# (armored), suite `mozilla`, component `main`, plus the official pin
# (Pin-Priority 1000 on origin packages.mozilla.org) so Ubuntu's
# snap-transition stub never shadows the real deb.
- id: firefox-repo
  description: "Mozilla official APT repository (packages.mozilla.org, with the official apt pin)"
  type: deb
  name: mozilla
  key_url: "https://packages.mozilla.org/apt/repo-signing-key.gpg"
  repo_url: "https://packages.mozilla.org/apt"
  suite: mozilla
  components: [main]
  pin:
    package: "*"
    pin: "origin packages.mozilla.org"
    priority: 1000
  depends_on: [curl, gnupg]
  tags: [gui, browser, repo]
  source: official

# https://support.mozilla.org/en-US/kb/install-firefox-linux — hits:
# flathub+curation+pkgstats (core), popcon (aux). noble's `firefox` apt package
# is a snap-transition stub; the real deb is Mozilla's own repo (recommended
# for Ubuntu by the official doc), made to win by the repo entry's pin.
- id: firefox
  description: "Mozilla Firefox (real deb from Mozilla's official APT repo)"
  type: apt
  package: firefox
  depends_on: [firefox-repo]
  requires: [desktop]
  tags: [gui, browser]
  source: official

# https://brave.com/linux/ — repo half of the brave chain (hits on the brave
# entry below). Official Ubuntu repo verified 2026-06-11: the signing key is
# ALREADY a binary keyring (no dearmor — the provider sniffs), and the
# official brave-browser.sources says Suites: stable, Components: main,
# Architectures: amd64 arm64 (fetched and mirrored here).
- id: brave-repo
  description: "Brave official APT repository (brave-browser-apt-release.s3.brave.com)"
  type: deb
  name: brave-browser
  key_url: "https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg"
  repo_url: "https://brave-browser-apt-release.s3.brave.com"
  suite: stable
  components: [main]
  architectures: [amd64, arm64]
  depends_on: [curl]
  tags: [gui, browser, repo]
  source: official

# https://brave.com/linux/ — hits: flathub+pkgstats (core), popcon (aux).
# Official stance: prefer the native apt repo over snap/flatpak (their flatpak
# alters the Chromium sandbox); the one-line install.sh just configures this
# same repo on Debian-family systems.
- id: brave
  description: "Brave Browser (official apt repo; package brave-browser)"
  type: apt
  package: brave-browser
  depends_on: [brave-repo]
  requires: [desktop]
  tags: [gui, browser]
  source: official

# https://www.google.com/chrome/ — hits: flathub+pkgstats (core), popcon (aux).
# Official install is the stable direct .deb (URL verified 2026-06-11; always
# the latest stable, amd64 only — no official Linux arm64 build). The .deb's
# postinst self-configures Google's apt repo for subsequent upgrades.
- id: chrome
  description: "Google Chrome (official .deb; self-configures Google's apt repo for updates)"
  type: deb
  deb_url: "https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb"
  package: google-chrome-stable
  depends_on: [curl]
  requires: [desktop]
  tags: [gui, browser]
  source: official

# https://learn.microsoft.com/en-us/linux/packages — repo half of the edge
# chain (hits on the edge entry below). packages.microsoft.com/repos/edge
# verified 2026-06-11: same microsoft.asc trust root as the vscode repo
# (separate scoped keyring file per repo), suite stable/main, amd64 only.
# name MUST NOT be `microsoft-edge`: the edge .deb's postinst hardcodes and
# REWRITES /etc/apt/sources.list.d/microsoft-edge.sources as its own managed
# file (verified 2026-06-12 — a same-named entry never converges); with a
# distinct basename the postinst leaves ours alone and comments out its copy.
- id: edge-repo
  description: "Microsoft Edge APT repository (packages.microsoft.com/repos/edge)"
  type: deb
  name: edge-repo
  key_url: "https://packages.microsoft.com/keys/microsoft.asc"
  repo_url: "https://packages.microsoft.com/repos/edge"
  suite: stable
  components: [main]
  architectures: [amd64]
  depends_on: [curl, gnupg]
  tags: [gui, browser, repo]
  source: official

# https://learn.microsoft.com/en-us/linux/packages — hits: flathub+pkgstats
# (core), popcon (aux). Not in the Ubuntu archive; Microsoft's repo is the
# official channel (the website .deb also auto-registers it). amd64 only.
- id: edge
  description: "Microsoft Edge (official apt repo; package microsoft-edge-stable)"
  type: apt
  package: microsoft-edge-stable
  depends_on: [edge-repo]
  requires: [desktop]
  tags: [gui, browser]
  source: official

# https://help.vivaldi.com/desktop/install-update/manual-setup-vivaldi-linux-repositories/
# — hits: flathub+pkgstats (core), popcon (aux). Official path (verified
# 2026-06-11; the manual-repo instructions were retired from that page): download
# the versioned .deb and `apt-get install ./vivaldi*.deb`. There is NO
# unversioned permalink — upgrading this entry means bumping the URL version
# (maintenance convention, same as obsidian). First install self-configures
# repo.vivaldi.com so the machine still gets apt upgrades afterwards.
- id: vivaldi
  description: "Vivaldi browser (official versioned .deb; self-configures repo.vivaldi.com for updates)"
  type: deb
  deb_url: "https://downloads.vivaldi.com/stable/vivaldi-stable_8.0.4033.46-1_amd64.deb"
  package: vivaldi-stable
  depends_on: [curl]
  requires: [desktop]
  tags: [gui, browser]
  source: official

