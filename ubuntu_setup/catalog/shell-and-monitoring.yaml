# Declarative catalog — shells, terminal workflow & system monitoring.
# Data, not code; validated against schema.json at load time.
# Sourcing: upstream install doc URL + intersection-research hits per entry
# (.trellis/tasks/06-10-intersection-research/research/final-list.json).

# https://github.com/aristocratos/btop#installation — hits: homebrew+pkgstats
# (core), popcon (aux). README acknowledges distro packages (repology badge);
# noble's 1.3 trails upstream 1.4 — snap/static binary are the fresh paths.
- id: btop
  description: "Resource monitor (btop++)"
  type: apt
  package: btop
  tags: [monitoring, cli]
  source: official

# https://htop.dev/downloads.html — hits: homebrew+pkgstats (core), popcon (aux).
# Official downloads page lists distro repositories; apt is the official path.
- id: htop
  description: "Interactive process viewer"
  type: apt
  package: htop
  tags: [monitoring, cli]
  source: official

# https://fishshell.com/ — hits: homebrew+pkgstats (core), popcon (aux).
# noble ships fish 3.7 (stable); the official ppa:fish-shell/release-4 is the
# 4.x path (future ppa-provider candidate). chsh is a usage step, not install.
- id: fish
  description: "Friendly interactive shell"
  type: apt
  package: fish
  tags: [shell, terminal]
  source: official

# https://github.com/tmux/tmux/wiki/Installing — hits: homebrew+pkgstats (core),
# popcon (aux). Official wiki lists `apt install tmux` for Debian/Ubuntu.
- id: tmux
  description: "Terminal multiplexer"
  type: apt
  package: tmux
  tags: [terminal, multiplexer]
  source: official

# https://zsh.sourceforge.io/FAQ/zshfaq01.html — hits: homebrew+pkgstats (core),
# popcon (aux). Upstream ships source archives only; noble main has the latest
# stable 5.9. Setting it as login shell (chsh) is config, not install.
- id: zsh
  description: "Z shell"
  type: apt
  package: zsh
  tags: [shell, terminal]
  source: official

# https://starship.rs/ ("Get Started") — hits: homebrew+pkgstats (core),
# awesome (aux). Not in the noble archive; the official path is install.sh
# (`curl -sS https://starship.rs/install.sh | sh`). The flags are the
# installer's own documented options (verified installer source, 2026-06-11):
# `--yes` skips the confirmation prompt (the script errors without a tty
# otherwise), `--bin-dir` keeps the install user-level — the default
# /usr/local/bin makes the script self-escalate with its own sudo, against
# this tool's per-command escalation model. The script requires the bin dir
# to already exist, hence the mkdir. Shell init (`eval "$(starship init
# bash)"`) is the official docs' per-user rc step, not this tool's.
- id: starship
  description: "Starship cross-shell prompt (~/.local/bin; add the init line to your shell rc)"
  type: script
  check: test -x "$HOME/.local/bin/starship"
  install: mkdir -p "$HOME/.local/bin" && curl -sS https://starship.rs/install.sh | sh -s -- --yes --bin-dir "$HOME/.local/bin"
  depends_on: [curl]
  tags: [shell, terminal, prompt]
  source: official

# https://github.com/ajeetdsouza/zoxide#installation — hits: homebrew+pkgstats
# (core), awesome (aux). The README strikes through the Debian/Ubuntu apt row
# ("update too slowly") and points those users at install.sh — the official
# path for noble, quoted verbatim. Installs to ~/.local/bin (the installer's
# default; verified installer source, 2026-06-11). The per-shell activation
# (`eval "$(zoxide init bash)"`) is the official docs' rc step, not this
# tool's.
- id: zoxide
  description: "zoxide — smarter cd (~/.local/bin; add the init line to your shell rc)"
  type: script
  check: test -x "$HOME/.local/bin/zoxide"
  install: curl -sSfL https://raw.githubusercontent.com/ajeetdsouza/zoxide/main/install.sh | sh
  depends_on: [curl]
  tags: [shell, terminal, cli]
  source: official
