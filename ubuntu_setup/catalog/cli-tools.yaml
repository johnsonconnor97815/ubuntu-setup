# Declarative catalog — general-purpose CLI utilities. Data, not code;
# validated against schema.json at load time. Adding normal software touches
# only this YAML — never Python.
# Sourcing: upstream install doc URL + intersection-research hits per entry
# (.trellis/tasks/06-10-intersection-research/research/final-list.json).

# https://github.com/sharkdp/bat#on-ubuntu-using-apt — hits: homebrew+pkgstats (core),
# popcon+awesome (aux). noble's bat package installs the binary as /usr/bin/batcat
# (name clash with another package) — probe batcat, not bat.
- id: bat
  description: "Cat clone with syntax highlighting (Ubuntu binary: batcat)"
  type: apt
  package: bat
  tags: [cli, viewer]
  source: official

# https://github.com/eza-community/eza/blob/main/INSTALL.md — hits:
# homebrew+pkgstats (core), awesome (aux). noble universe ships 0.18 (older
# than upstream 0.2x); the gierens.de third-party repo is the newer-version path.
- id: eza
  description: "Modern ls replacement"
  type: apt
  package: eza
  tags: [cli, files]
  source: official

# https://github.com/sharkdp/fd#on-ubuntu — hits: homebrew+pkgstats (core),
# popcon+awesome (aux). Package is fd-find, the binary is fdfind ("fd" was taken).
- id: fd
  description: "Fast, friendly find alternative (package fd-find, binary fdfind)"
  type: apt
  package: fd-find
  tags: [cli, search]
  source: official

# https://github.com/junegunn/fzf#linux-packages — hits: homebrew+pkgstats (core),
# popcon+awesome (aux). noble's 0.44 predates the `fzf --bash` shell-integration flags.
- id: fzf
  description: "Command-line fuzzy finder"
  type: apt
  package: fzf
  tags: [cli, search]
  source: official

# https://jqlang.org/download/ — hits: homebrew+pkgstats (core), popcon+awesome (aux).
# Official download page: "jq is in the official Debian and Ubuntu repositories".
- id: jq
  description: "Command-line JSON processor"
  type: apt
  package: jq
  tags: [cli, json]
  source: official

# https://www.7-zip.org/download.html — hits: homebrew+pkgstats (core), popcon (aux).
# final-list key p7zip; on noble the upstream 7-Zip is packaged as `7zip`.
# Verified against the real package (2026-06-11): it installs /usr/bin/7z
# (+7za/7zr/p7zip) — NOT upstream's `7zz` name the research note guessed.
# p7zip-full is only a transitional shell.
- id: 7zip
  description: "7-Zip archiver (binary: 7z; supersedes transitional p7zip-full)"
  type: apt
  package: 7zip
  tags: [cli, archive]
  source: official

# https://pandoc.org/installing.html — hits: homebrew+pkgstats (core), popcon (aux).
# Official install page endorses distro packages; PDF output needs LaTeX (optional).
- id: pandoc
  description: "Universal document converter"
  type: apt
  package: pandoc
  tags: [cli, documents]
  source: official

# https://github.com/BurntSushi/ripgrep#installation — hits: homebrew+pkgstats (core),
# popcon+awesome (aux). README explicitly endorses apt for Ubuntu; never the snap.
- id: ripgrep
  description: "Fast recursive grep (rg)"
  type: apt
  package: ripgrep
  tags: [cli, search]
  source: official

# https://rsync.samba.org/download.html — hits: homebrew+pkgstats (core), popcon (aux).
# Upstream releases source only; preinstalled on standard Ubuntu desktop/server images.
- id: rsync
  description: "Fast incremental file transfer"
  type: apt
  package: rsync
  tags: [cli, sync]
  source: official

# https://github.com/Old-Man-Programmer/tree — hits: homebrew+pkgstats (core), popcon (aux).
# Upstream ships source only; the distro package is the de-facto install path.
- id: tree
  description: "List directories as a tree"
  type: apt
  package: tree
  tags: [cli]
  source: official
