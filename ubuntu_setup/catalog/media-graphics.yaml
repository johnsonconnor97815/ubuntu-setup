# Declarative catalog — media & graphics CLI toolkits (no desktop required).
# Data, not code; validated against schema.json at load time.
# Sourcing: upstream install doc URL + intersection-research hits per entry
# (.trellis/tasks/06-10-intersection-research/research/final-list.json).

# https://ffmpeg.org/download.html — hits: homebrew+pkgstats (core), popcon (aux).
# Official download page links "Ubuntu – Official packages" -> apt install ffmpeg.
- id: ffmpeg
  description: "Audio/video converter and toolkit"
  type: apt
  package: ffmpeg
  tags: [cli, media, video]
  source: official

# https://graphviz.org/download/ — hits: homebrew+pkgstats (core), popcon (aux).
# Official download page: `sudo apt install graphviz` for Debian/Ubuntu.
- id: graphviz
  description: "Graph drawing tools (dot, neato, ...)"
  type: apt
  package: graphviz
  tags: [cli, graphics, diagrams]
  source: official

# https://imagemagick.org/script/download.php — hits: homebrew+pkgstats (core),
# popcon (aux). noble packages the IM6 line (commands convert/identify);
# upstream IM7 (command magick) is AppImage-only — not provider-expressible.
- id: imagemagick
  description: "Image manipulation toolkit (IM6 on noble; commands convert/identify)"
  type: apt
  package: imagemagick
  tags: [cli, graphics, images]
  source: official

# https://github.com/yt-dlp/yt-dlp/wiki/Installation — repo half of the yt-dlp
# chain (hits on the yt-dlp entry below). The official wiki's Ubuntu APT answer
# is this PPA. CAVEAT: it is run by tomtomtom — a third-party maintainer the
# project's own install doc cites, not the yt-dlp team itself (research note
# kept on record); reviewed and accepted because the archive-version
# alternative is non-functional. noble InRelease + key endpoint verified
# 2026-06-12.
- id: yt-dlp-repo
  description: "yt-dlp PPA cited by the official install wiki (ppa:tomtomtom/yt-dlp)"
  type: ppa
  ppa: tomtomtom/yt-dlp
  depends_on: [curl, gnupg]
  tags: [cli, media, repo]
  source: official

# https://github.com/yt-dlp/yt-dlp/wiki/Installation — hits: homebrew+pkgstats
# (core), popcon+awesome (aux). yt-dlp must update frequently to keep up with
# site changes: noble universe froze at 2024.04 and is effectively dead against
# current sites, so the wiki's PPA (tracking upstream releases) is the only
# viable apt-shaped channel.
- id: yt-dlp
  description: "Download video/audio from thousands of sites (PPA-fresh build)"
  type: apt
  package: yt-dlp
  depends_on: [yt-dlp-repo]
  tags: [cli, media, download]
  source: official
