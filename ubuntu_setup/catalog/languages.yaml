# Declarative catalog — language runtimes & SDKs. Data, not code; validated
# against schema.json at load time.
# Sourcing: upstream install doc URL + intersection-research hits per entry
# (.trellis/tasks/06-10-intersection-research/research/final-list.json).

# https://go.dev/doc/install — hits: so-survey+homebrew+pkgstats (core),
# jetbrains+popcon (aux). Official doc covers the tarball only and does not
# oppose distro packages; noble ships Go 1.22 (behind upstream — the tarball
# is the fresh path for version-sensitive users).
- id: go
  description: "Go toolchain (package golang-go; noble ships Go 1.22)"
  type: apt
  package: golang-go
  tags: [languages, go]
  source: official

# https://nodejs.org/en/download — hits: so-survey+homebrew+pkgstats (core),
# jetbrains+popcon (aux). noble ships Node 18 (upstream EOL; Ubuntu maintains
# security fixes through the LTS window). npm is NOT included — it is a
# separate Ubuntu package (`npm`), install it alongside when needed.
- id: nodejs
  description: "Node.js runtime (npm is a separate Ubuntu package)"
  type: apt
  package: nodejs
  tags: [languages, javascript]
  source: official

# https://openjdk.org/install/ — hits: so-survey+homebrew+pkgstats (core),
# jetbrains+popcon (aux). Java ecosystem convention: GA builds are distributed
# by distros; default-jdk on noble resolves to OpenJDK 21 LTS.
- id: openjdk
  description: "Default OpenJDK (default-jdk resolves to OpenJDK 21 LTS on noble)"
  type: apt
  package: default-jdk
  tags: [languages, java]
  source: official

# https://www.php.net/manual/en/install.unix.debian.php — hits:
# so-survey+homebrew+pkgstats (core), jetbrains+popcon (aux). php.net's
# Debian/Ubuntu manual recommends apt. The php meta-package pulls the Apache
# module; CLI-only users may prefer php-cli.
- id: php
  description: "PHP interpreter (meta-package; pulls the Apache module)"
  type: apt
  package: php
  tags: [languages, php]
  source: official

# https://docs.python.org/3/using/unix.html — hits: so-survey+homebrew+pkgstats
# (core), jetbrains+popcon (aux). Preinstalled on Ubuntu 24.04; this entry
# anchors the python3 ecosystem (venv/pip below complete it).
- id: python3
  description: "Python 3 interpreter (preinstalled on Ubuntu 24.04)"
  type: apt
  package: python3
  tags: [languages, python, bedrock]
  source: official

# bedrock whitelist (approved 2026-06-10, "python3-venv+pip"): 24.04 is
# PEP 668 externally-managed — venv is the sanctioned way to install Python
# software. Split from python3-pip because the apt provider takes one package
# per entry.
- id: python3-venv
  description: "venv module for Python virtual environments (PEP 668 era)"
  type: apt
  package: python3-venv
  tags: [languages, python, bedrock]
  source: official

# bedrock whitelist (approved 2026-06-10, "python3-venv+pip"): pip inside
# venvs / --user installs. Second half of the python3-venv+pip decision.
- id: python3-pip
  description: "pip — the Python package installer"
  type: apt
  package: python3-pip
  tags: [languages, python, bedrock]
  source: official

# https://www.ruby-lang.org/en/documentation/installation/ — hits:
# so-survey+homebrew+pkgstats (core), jetbrains+popcon (aux). Official install
# page's apt section: `apt-get install ruby-full`.
- id: ruby
  description: "Ruby with development headers (ruby-full)"
  type: apt
  package: ruby-full
  tags: [languages, ruby]
  source: official

# https://learn.microsoft.com/en-us/dotnet/core/install/linux-ubuntu-2404 —
# hits: so-survey+pkgstats (core), jetbrains (aux). Since 24.04 Microsoft
# distributes .NET through Ubuntu's own feed (Canonical-maintained) — apt IS
# the official path. 8.0 is the LTS default.
- id: dotnet
  description: ".NET SDK 8.0 LTS (Canonical-maintained Ubuntu feed)"
  type: apt
  package: dotnet-sdk-8.0
  tags: [languages, dotnet, csharp]
  source: official

# https://kotlinlang.org/docs/command-line.html — hits: so-survey+pkgstats
# (core), jetbrains (aux). noble's apt `kotlin` is 1.3.31 (2019) — unusably
# stale (upstream 2.4.x); the official command-line doc's Ubuntu instruction
# is exactly `sudo snap install --classic kotlin`. Store verified 2026-06-11:
# publisher jetbrains (verified account), confinement classic (--classic is
# mandatory), latest/stable 2.4.0. Runtime note: kotlinc needs a JDK to run —
# the official install steps list no prerequisite (install converges without
# one), so this is a usage note, not a depends_on edge (pair with `openjdk`).
- id: kotlin
  description: "Kotlin command-line compiler (official JetBrains classic snap; running kotlinc needs a JDK)"
  type: snap
  classic: true
  tags: [languages, kotlin, snap]
  source: official

# https://www.lua.org/download.html — hits: so-survey+homebrew (core),
# jetbrains (aux). lua.org ships source only and defers binaries to distros.
# noble has no unversioned `lua` package — the command is lua5.4.
- id: lua
  description: "Lua 5.4 interpreter (command: lua5.4)"
  type: apt
  package: lua5.4
  tags: [languages, lua]
  source: official

# dependency citation: prerequisite of the typescript and yarn script entries
# (final-list prerequisite_citations: npm x2). Ubuntu's nodejs package does NOT
# include npm — it is this separate package (9.2.0 on noble). Its global
# prefix is /usr/local (verified in a clean 24.04 container, 2026-06-11), so
# `npm install -g` writes root-owned paths.
- id: npm
  description: "npm — Node.js package manager (separate from Ubuntu's nodejs package)"
  type: apt
  package: npm
  tags: [languages, javascript, package-manager]
  source: official

# https://www.rust-lang.org/tools/install — hits: so-survey+homebrew+pkgstats
# (core), jetbrains+popcon (aux). The official page marks rustup as
# "Recommended"; distro rustc trails the 6-week train badly enough that
# upstream discourages it for development. Verbatim official one-liner plus
# the installer's own documented unattended flag (`-y` — rustup book,
# "Unattended installation"). User-level: ~/.rustup + ~/.cargo; PATH comes
# from the script's own shell-rc edit (~/.cargo/env) — the user's/installer's
# responsibility, not this tool's. Compiling crates additionally needs a C
# linker (build-essential) at runtime — a usage note, not an install step.
- id: rust
  description: "Rust toolchain via rustup (rustc+cargo in ~/.cargo; needs a C linker to build crates)"
  type: script
  check: test -x "$HOME/.cargo/bin/rustc"
  install: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
  depends_on: [curl]
  tags: [languages, rust]
  source: official

# https://bun.com/docs/installation — hits: so-survey+homebrew+pkgstats (core).
# No apt/deb/snap channel; the official install script is the only Linux path.
# Verbatim official one-liner; the script hard-requires unzip (it errors
# without it — verified installer source, 2026-06-11) and installs the single
# binary to ~/.bun/bin. Shell-rc PATH edits are the script's own doing.
- id: bun
  description: "Bun JavaScript runtime & toolkit (single binary in ~/.bun/bin)"
  type: script
  check: test -x "$HOME/.bun/bin/bun"
  install: curl -fsSL https://bun.com/install | bash
  depends_on: [curl, unzip]
  tags: [languages, javascript]
  source: official

# https://docs.deno.com/runtime/getting_started/installation/ — hits:
# so-survey+homebrew+pkgstats (core). No apt/deb/ppa channel; the official
# deno_install script is the first-listed path. Verbatim official one-liner;
# the script needs unzip (or 7z) and installs to ~/.deno/bin. Its interactive
# shell-setup prompt only fires on a tty (verified installer source,
# 2026-06-11) — non-interactive runs skip it cleanly.
- id: deno
  description: "Deno JavaScript/TypeScript runtime (single binary in ~/.deno/bin)"
  type: script
  check: test -x "$HOME/.deno/bin/deno"
  install: curl -fsSL https://deno.land/install.sh | sh
  depends_on: [curl, unzip]
  tags: [languages, javascript, typescript]
  source: official

# https://www.typescriptlang.org/download/ — hits: so-survey+pkgstats (core),
# jetbrains (aux). noble's node-typescript (4.8, 2022) is too old for modern
# TS projects (research verdict: below the usability bar). The official page
# documents the per-project `npm install typescript --save-dev`; this catalog
# manages a machine-global CLI, so the entry uses npm's documented global
# variant `npm install -g typescript`. Root vs user decision: on noble npm's
# global prefix is /usr/local (root-owned; verified in a clean 24.04
# container, 2026-06-11) — so this is a root-level entry with per-command
# sudo (a user-level prefix would require npmrc config mutation, out of
# provider scope).
- id: typescript
  description: "TypeScript compiler (tsc) installed globally via npm"
  type: script
  sudo: true
  check: test -x /usr/local/bin/tsc
  install: npm install -g typescript
  depends_on: [nodejs, npm]
  tags: [languages, typescript, javascript]
  source: official
