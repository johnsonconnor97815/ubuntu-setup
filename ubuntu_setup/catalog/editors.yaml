# Declarative catalog — terminal editors. Data, not code; validated against
# schema.json at load time.
# Sourcing: upstream install doc URL + intersection-research hits per entry
# (.trellis/tasks/06-10-intersection-research/research/final-list.json).

# https://github.com/neovim/neovim/blob/master/INSTALL.md — hits:
# so-survey+homebrew+pkgstats (core), jetbrains+popcon (aux). INSTALL.md lists
# `apt install neovim` for Ubuntu; noble's 0.9 is well behind upstream 0.12
# (some plugin ecosystems want >=0.10) — the official tarball is the fresh path.
- id: neovim
  description: "Hyperextensible Vim-based editor (nvim)"
  type: apt
  package: neovim
  tags: [editor, vim]
  source: official

# https://www.vim.org/download.php — hits: so-survey+homebrew+pkgstats (core),
# jetbrains+popcon (aux). Ubuntu preinstalls only vim-tiny; this is the full vim.
- id: vim
  description: "Vi IMproved — the full vim package (Ubuntu preinstalls only vim-tiny)"
  type: apt
  package: vim
  tags: [editor, vim]
  source: official

# https://www.nano-editor.org/download.php — hits: so-survey+pkgstats (core),
# popcon (aux). GNU upstream ships source only; preinstalled on standard Ubuntu.
- id: nano
  description: "Simple terminal text editor (usually preinstalled on Ubuntu)"
  type: apt
  package: nano
  tags: [editor]
  source: official

# https://code.visualstudio.com/docs/setup/linux — repo half of the vscode
# chain (hits on the vscode entry below). Official manual-repo setup verified
# 2026-06-11: key https://packages.microsoft.com/keys/microsoft.asc dearmored
# to a binary keyring, deb822 vscode.sources (Suites: stable, Components:
# main, Architectures: amd64,arm64,armhf). curl+gnupg are the key
# download/dearmor prerequisites (the official doc uses wget+gpg; curl is our
# catalog's download bedrock). The repo entry itself carries no `requires` —
# the GUI dependent does (authoring-guidelines).
- id: vscode-repo
  description: "Microsoft Visual Studio Code APT repository (packages.microsoft.com)"
  type: deb
  name: vscode
  key_url: "https://packages.microsoft.com/keys/microsoft.asc"
  repo_url: "https://packages.microsoft.com/repos/code"
  suite: stable
  components: [main]
  architectures: [amd64, arm64, armhf]
  depends_on: [curl, gnupg]
  tags: [editor, repo]
  source: official

# https://code.visualstudio.com/docs/setup/linux — hits: so-survey+flathub+
# pkgstats (core), jetbrains+popcon (aux). Not in the Ubuntu archive; the
# official path is Microsoft's own apt repo (package name is `code`).
- id: vscode
  description: "Visual Studio Code (Microsoft's official deb repo; package `code`)"
  type: apt
  package: code
  depends_on: [vscode-repo]
  requires: [desktop]
  tags: [editor, gui]
  source: official
