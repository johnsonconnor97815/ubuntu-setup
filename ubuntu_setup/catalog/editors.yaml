# Declarative catalog — terminal editors. Data, not code; validated against
# schema.json at load time.
# Sourcing: upstream install doc URL + intersection-research hits per entry
# (.trellis/tasks/06-10-intersection-research/research/final-list.json).

# https://github.com/neovim/neovim/blob/master/INSTALL.md — hits:
# so-survey+homebrew+pkgstats (core), jetbrains+popcon (aux). INSTALL.md lists
# `apt install neovim` for Ubuntu; noble's 0.9 is well behind upstream 0.12
# (some plugin ecosystems want >=0.10) — the official tarball is the fresh path.
- id: neovim
  description: "Hyperextensible Vim-based editor (nvim)"
  type: apt
  package: neovim
  tags: [editor, vim]
  source: official

# https://www.vim.org/download.php — hits: so-survey+homebrew+pkgstats (core),
# jetbrains+popcon (aux). Ubuntu preinstalls only vim-tiny; this is the full vim.
- id: vim
  description: "Vi IMproved — the full vim package (Ubuntu preinstalls only vim-tiny)"
  type: apt
  package: vim
  tags: [editor, vim]
  source: official

# https://www.nano-editor.org/download.php — hits: so-survey+pkgstats (core),
# popcon (aux). GNU upstream ships source only; preinstalled on standard Ubuntu.
- id: nano
  description: "Simple terminal text editor (usually preinstalled on Ubuntu)"
  type: apt
  package: nano
  tags: [editor]
  source: official

# https://code.visualstudio.com/docs/setup/linux — repo half of the vscode
# chain (hits on the vscode entry below). Official manual-repo setup verified
# 2026-06-11: key https://packages.microsoft.com/keys/microsoft.asc dearmored
# to a binary keyring, deb822 vscode.sources (Suites: stable, Components:
# main, Architectures: amd64,arm64,armhf). curl+gnupg are the key
# download/dearmor prerequisites (the official doc uses wget+gpg; curl is our
# catalog's download bedrock). The repo entry itself carries no `requires` —
# the GUI dependent does (authoring-guidelines).
- id: vscode-repo
  description: "Microsoft Visual Studio Code APT repository (packages.microsoft.com)"
  type: deb
  name: vscode
  key_url: "https://packages.microsoft.com/keys/microsoft.asc"
  repo_url: "https://packages.microsoft.com/repos/code"
  suite: stable
  components: [main]
  architectures: [amd64, arm64, armhf]
  depends_on: [curl, gnupg]
  tags: [editor, repo]
  source: official

# https://code.visualstudio.com/docs/setup/linux — hits: so-survey+flathub+
# pkgstats (core), jetbrains+popcon (aux). Not in the Ubuntu archive; the
# official path is Microsoft's own apt repo (package name is `code`).
- id: vscode
  description: "Visual Studio Code (Microsoft's official deb repo; package `code`)"
  type: apt
  package: code
  depends_on: [vscode-repo]
  requires: [desktop]
  tags: [editor, gui]
  source: official

# https://vscodium.com/#install — repo half of the vscodium chain (hits on the
# vscodium entry below). The deb repo (download.vscodium.com, key from the
# paulcarroty vscodium-deb-rpm-repo project) is what the official site
# documents for Debian/Ubuntu — project-endorsed, maintainer-operated
# (research caveat noted). Verified 2026-06-11: suite vscodium, component
# main, amd64+arm64 per the official .list line.
- id: vscodium-repo
  description: "VSCodium APT repository (download.vscodium.com, site-endorsed)"
  type: deb
  name: vscodium
  key_url: "https://gitlab.com/paulcarroty/vscodium-deb-rpm-repo/raw/master/pub.gpg"
  repo_url: "https://download.vscodium.com/debs"
  suite: vscodium
  components: [main]
  architectures: [amd64, arm64]
  depends_on: [curl, gnupg]
  tags: [editor, repo]
  source: official

# https://vscodium.com/#install — hits: so-survey+flathub+pkgstats (core),
# popcon (aux). Telemetry-free VS Code build; not in the Ubuntu archive, the
# site's Debian/Ubuntu path is the repo above (package name is `codium`).
- id: vscodium
  description: "VSCodium — community VS Code build without telemetry (package `codium`)"
  type: apt
  package: codium
  depends_on: [vscodium-repo]
  requires: [desktop]
  tags: [editor, gui]
  source: official

# https://www.sublimetext.com/docs/linux_repositories.html — repo half of the
# sublime-text chain (hits on the sublime-text entry below). Official repo
# verified 2026-06-11: a FLAT repo at a path — deb822 `Suites: apt/stable/`
# with no Components line (the provider omits it for flat repos); key
# sublimehq-pub.gpg is armored despite the .gpg name (sniffed + dearmored).
- id: sublime-text-repo
  description: "Sublime HQ official APT repository (download.sublimetext.com, flat apt/stable/)"
  type: deb
  name: sublime-text
  key_url: "https://download.sublimetext.com/sublimehq-pub.gpg"
  repo_url: "https://download.sublimetext.com/"
  suite: "apt/stable/"
  depends_on: [curl, gnupg]
  tags: [editor, repo]
  source: official

# https://www.sublimetext.com/docs/linux_repositories.html — hits:
# so-survey+pkgstats (core), jetbrains (aux). Not in the Ubuntu archive; the
# official doc's first choice for Ubuntu/Debian is their own apt repo
# (the snap exists but the doc leads with apt). CLI binary is `subl`.
- id: sublime-text
  description: "Sublime Text editor (official apt repo; CLI binary `subl`)"
  type: apt
  package: sublime-text
  depends_on: [sublime-text-repo]
  requires: [desktop]
  tags: [editor, gui]
  source: official

# https://jupyterlab.readthedocs.io/en/stable/getting_started/installation.html
# — hits: so-survey+homebrew+pkgstats (core), jetbrains (aux). Not packaged on
# noble (jupyter-notebook is the classic Notebook, a different product). The
# official doc installs from PyPI (`pip install jupyterlab`); on 24.04 PEP 668
# marks the system Python externally-managed, so the sanctioned way to install
# a PyPI *application* is pipx (research annotation: "落地以 pipx install
# jupyterlab"). User-level: venv under ~/.local/share/pipx, binaries in
# ~/.local/bin. A terminal-launched, browser-served app — no desktop required.
- id: jupyterlab
  description: "JupyterLab — web-based interactive computing (via pipx; ~/.local/bin/jupyter-lab)"
  type: script
  check: test -x "$HOME/.local/bin/jupyter-lab"
  install: pipx install jupyterlab
  depends_on: [pipx]
  tags: [editor, python, notebook]
  source: official

# https://zed.dev/docs/linux — hits: so-survey+pkgstats (core), jetbrains
# (aux). Not in the noble archive (the doc's Debian/Ubuntu apt repos are
# explicitly community-maintained — research: do not map to deb); the official
# install is the `curl -f https://zed.dev/install.sh | sh` one-liner, plus a
# SHELL fallback: the installer runs under `set -u` and reads $SHELL to print
# PATH advice, so it dies in non-login contexts where SHELL is unset (found
# by real-install verification, 2026-06-12: "sh: 63: SHELL: parameter not
# set" AFTER the binary landed). User-level: unpacks to ~/.local/zed.app and
# symlinks ~/.local/bin/zed (verified installer source, 2026-06-11). Needs a
# Vulkan-capable GPU at runtime (not at install).
- id: zed
  description: "Zed — fast collaborative code editor (user-level; ~/.local/bin/zed)"
  type: script
  check: test -x "$HOME/.local/bin/zed"
  install: export SHELL="${SHELL:-/bin/bash}" && curl -f https://zed.dev/install.sh | sh
  depends_on: [curl]
  requires: [desktop]
  tags: [editor, gui]
  source: official
